service: soon
image: ghcr.io/sociallayer-im/soon

# Default stack, stated explicitly: Nomad schedules the container, Traefik picks
# it up from the container labels and routes to it. Only nomad+traefik and
# docker+kamal-proxy are valid pairs.
runner: nomad
egress: traefik

servers:
  web:
    hosts: [sg.sola.day]
    primary: true

registry:
  server: ghcr.io
  username: jiangplus
  password: GHCR_TOKEN

proxy:
  # During the cutover this is the staging domain only. Step 16 of
  # design/MIGRATION_PLAN.md §7 changes it to [api.sola.day, soon-api.sola.day]
  # AFTER sails has released api.sola.day — Traefik routes by Host rule, and a
  # rule claimed by two services at once resolves unpredictably.
  hosts: [soon-api.sola.day]
  app_port: 8080
  ssl: true
  health_check_path: /up

# sg.sola.day has 3.9GB physical and already runs TWELVE services (sails, both
# Next.js apps, plus loop/semi/wave/flow/hometown/xray/yatch-mirror). Measured
# 2026-07-30: 2.8GB used, ~1.1GB available, 1GB of cold swap with si/so at zero.
#
# Nomad is deliberately told the node has 8GB (over-provision) and schedules on
# the `memory` RESERVATION, so 300 slots in easily. `memory_max` is the real
# guard: it is the hard ceiling this container can reach, and on a box with
# ~1.1GB of headroom shared by 12 services it must stay well under that or one
# leak drags everything into swap. 640 is ~2x the measured footprint of sails
# (~350MB), which is the closest comparable workload.
#
# Memory oversubscription is enabled on this cluster (verified 2026-07-30), so
# memory_max is honoured rather than silently ignored.
resources:
  cpu: 256
  memory: 300
  memory_max: 640

ssh:
  user: root
  command_timeout: 600

builder:
  arch: amd64
  remote: ssh://ubuntu@wamo.city

env:
  RAILS_ENV: production
  # WEB_CONCURRENCY is deliberately NOT set. Puma treats any value — including
  # "1" — as a request for CLUSTER mode, and config/puma.rb has no `workers`
  # directive, so leaving it unset gives single mode.
  #
  # This is not just a memory tweak. GoodJob runs in-process
  # (execution_mode :async, config/initializers/good_job.rb). Under cluster mode
  # its scheduler and LISTEN connection start in the Puma MASTER, before the
  # worker forks; the forked worker then hangs forever on the first request that
  # touches the database — no SQL issued, no error, no timeout. Setting
  # WEB_CONCURRENCY=1 reproduced exactly that on the first soon deploy.
  RAILS_MAX_THREADS: "3"
  GOOD_JOB_MAX_THREADS: "3"
  THRUSTER_HTTP_PORT: "8080"
  THRUSTER_TARGET_PORT: "3000"

secrets:
  load: [.env.production]
  inject:
    - DATABASE_URL
    - SECRET_KEY_BASE
    - JWT_SECRET
    - NEXT_TOKEN
    - RESEND_API_KEY
    - CLOUDFLARE_ACCOUNT_ID
    - CLOUDFLARE_IMAGES_TOKEN

retain_containers: 5
