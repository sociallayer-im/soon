service: soon
image: registry.juluo.xyz/soon

runner: nomad
egress: traefik
traefik_provider: nomad   # juluo Traefik uses the Nomad provider
force_pull: true          # always re-pull on deploy (robust to same-tag rebuilds)

servers:
  web:
    hosts: [juluo.xyz]
    primary: true

registry:
  server: registry.juluo.xyz
  username: username
  password: YATCH_TOKEN          # resolved from .env.cn.production

proxy:
  hosts: [api.juluo.xyz]
  app_port: 8080
  ssl: true
  health_check_path: /up
  deploy_timeout: 90

ssh:
  user: root

builder:
  arch: amd64
  # Build overseas where upstream (Debian/gems/npm) is fast and unfiltered — no
  # China-mirror or proxy crutches needed.
  remote: ssh://ubuntu@wamo.city
  # Push to the Singapore mirror (clean wamo→SG link, no GFW). It shares OSS +
  # Postgres with registry.juluo.xyz, so juluo pulls the same image fast.
  push_registry: mirror-registry.sola.day
  # See ginger.yml — mode=min would export only the final stage, leaving
  # `bundle install` (rbsecp256k1 built from source) uncached in the registry.
  cache: max

# App joins the "ginger" docker network (default); Postgres is on the same
# network with alias "postgres" — same in-cluster database sails already
# uses (see .env.cn.production), not a separate soon-only database like SG's
# sola_soon_db.
env:
  RAILS_ENV: production
  # WEB_CONCURRENCY is deliberately NOT set — see soon/ginger.yml (SG) for
  # why: Puma cluster mode + GoodJob's in-process async executor hangs the
  # first DB-touching request forever.
  RAILS_MAX_THREADS: "3"
  GOOD_JOB_MAX_THREADS: "1"
  THRUSTER_HTTP_PORT: "8080"
  THRUSTER_TARGET_PORT: "3000"
  # WeChat Pay is the CN rail, the mirror image of STRIPE_ENABLED being set
  # only on SG. The flag alone does nothing until `rails wechat_pay:install`
  # has stored the merchant.
  WECHAT_PAY_ENABLED: "true"
  # The backend's OWN public origin, used to build notify_url. Unset it
  # defaults to localhost, which WeChat cannot reach and never reports —
  # payments would then only ever confirm through the 5-minute sweeper.
  # WEB_URL (the frontend) is a different thing and would 404 the callback.
  API_URL: "https://api.juluo.xyz"

secrets:
  load: [.env.cn.production]
  inject:
    - DATABASE_URL
    - SECRET_KEY_BASE
    - JWT_SECRET
    - NEXT_TOKEN
    - RESEND_API_KEY
    # Same R2 bucket as SG — see ginger.yml. It matters more here: the
    # imagedelivery.net URLs the old uploader produced are unreachable from
    # mainland China, datastore.sola.day is not.
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_HOST
    - AWS_BUCKET
    - S3_URL
    - MAIL_FROM
    - WEB_URL
    - APP_HOST
    - ALLOWED_SIWE_DOMAINS
    # Read by `rails wechat_pay:install`, which stores them on the merchant
    # row. Nothing reads them at request time — see WechatPaySetting.
    - WECHAT_PAY_MCHID
    - WECHAT_PAY_APP_ID
    - WECHAT_PAY_CERT_SERIAL
    - WECHAT_PAY_PRIVATE_KEY
    - WECHAT_PAY_APIV3_KEY
    - WECHAT_PAY_PUBLIC_KEY_ID
    - WECHAT_PAY_PUBLIC_KEY
    - WECHAT_PAY_MERCHANT_NAME
    # SMS sign-in. PHONE_LOGIN_ENABLED is the gate — the three /auth phone
    # endpoints 404 without it, so leaving it off ginger.yml is what keeps
    # this CN-only. Aliyun credentials shared with semi-backend.
    - PHONE_LOGIN_ENABLED
    - ALIYUN_ACCESS_KEY_ID
    - ALIYUN_ACCESS_KEY_SECRET
    # NOT ALIYUN_SMS_SIGN_NAME. Injection mangles non-ASCII — the UTF-8 签名
    # arrives double-encoded and every send fails with SMS_SIGNATURE_ILLEGAL.
    # It lives in SmsSender::SIGN_NAME instead; see the comment there.
    - ALIYUN_SMS_TEMPLATE_CODE

retain_containers: 5
